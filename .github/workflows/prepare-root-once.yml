name: One-time refresh release alias for PR 13
on:
  push:
    branches:
      - fix/pdf-review-notes-stability-20261115
permissions:
  contents: write
concurrency:
  group: pdf-review-notes-one-time-alias
  cancel-in-progress: true
jobs:
  build-and-commit:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate standalone files
        shell: pwsh
        run: ./build-standalone.ps1
      # The PR validation workflow runs all regression checks after this generated download is committed.
      - name: Commit generated root download
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf-review-notes.html
          if (git diff --cached --quiet) { Write-Host "Download is already current"; exit 0 }
          git commit -m "build: update v1.0.5 standalone HTML after final fixes"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
