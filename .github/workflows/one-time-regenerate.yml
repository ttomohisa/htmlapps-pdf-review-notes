name: One-time regenerate final standalone HTML
on:
  push:
    branches: [fix/pdf-review-notes-stability-20261115]
permissions:
  contents: write
concurrency:
  group: pdf-review-notes-one-time-build
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build standalone output
        shell: pwsh
        run: ./build-standalone.ps1
      - name: Commit generated download
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf-review-notes.html
          if (git diff --cached --quiet) { Write-Host "Already current"; exit 0 }
          git commit -m "build: sync standalone app after final UI checks"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
