name: Temporary fast regression diagnostics
on:
  push:
    branches: [fix/pdf-review-notes-stability-20261115]
permissions:
  contents: read
jobs:
  individual-tests:
    strategy:
      fail-fast: false
      matrix:
        file:
          - export-lifecycle.test.cjs
          - header-localization.test.cjs
          - help-copy.test.cjs
          - release-artifacts.test.cjs
          - responsive-controls.test.cjs
          - review-navigation.test.cjs
          - session-persistence.test.cjs
          - stability-fixes.test.cjs
          - release-readiness.test.cjs
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run one regression suite
        run: node --test --test-timeout=30000 --test-reporter=spec tests/${{ matrix.file }}
