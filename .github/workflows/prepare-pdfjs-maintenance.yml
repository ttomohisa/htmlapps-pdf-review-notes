name: Prepare PDF Review Notes dependency lock and release alias (temporary)
on:
  push:
    branches:
      - fix/pdf-review-notes-stability-20261115
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'ttomohisa/htmlapps-pdf-review-notes'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Resolve reviewed PDF.js update and verify standalone files
        shell: pwsh
        run: |
          ./scripts/update-dependency.ps1 -Id pdfjs -Version 6.5.438 -SkipBuild
          ./scripts/check-repository.ps1
      - name: Commit generated dependency lock and single HTML release alias
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dependencies.json dependencies.lock.json pdf-review-notes.html
          if (git diff --cached --quiet) { Write-Host "No generated changes" ; exit 0 }
          git commit -m "build: lock PDF.js 6.5.438 and refresh single-HTML download"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
